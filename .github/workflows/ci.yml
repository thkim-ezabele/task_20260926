# PR 워크플로 (PRD-001 FR-10 · NFR-03 · NFR-07, S01-T07)
# 순서: restore → build → format 검사 → test(커버리지 수집) → 커버리지 보고 → 아티팩트 업로드
# 로컬에서 같은 명령을 같은 순서로 실행할 수 있다(wiki/04-development/testing-strategy.md "CI").
# 액션은 커밋 SHA로 고정하고 뒤에 버전 주석을 단다(wiki/03-architecture/package-versions.md "GitHub Actions").
name: ci

on:
  # 기본 활동 유형(opened · synchronize · reopened)은 Draft PR에서도 실행된다.
  # 토픽 Draft PR(feature/prd-* → develop)에서도 돌아야 하므로 Draft를 거르지 않는다.
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CONFIGURATION: Release

jobs:
  build-test:
    name: build · format · test · coverage
    runs-on: ubuntu-24.04
    # NFR-07 목표는 10분. 멈춘 작업이 러너를 오래 잡지 않도록 여유를 두고 끊는다.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: .NET info
        run: dotnet --info

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore EmergencyHub.sln

      # 경고 = 오류는 Directory.Build.props(TreatWarningsAsErrors)가 처리한다.
      - name: Build
        run: dotnet build EmergencyHub.sln --no-restore --configuration "$CONFIGURATION"

      - name: Format check
        run: dotnet format EmergencyHub.sln --verify-no-changes --no-restore

      - name: Test (coverage)
        run: >-
          dotnet test EmergencyHub.sln
          --no-build
          --configuration "$CONFIGURATION"
          --collect "XPlat Code Coverage"
          --settings coverlet.runsettings
          --logger trx
          --results-directory TestResults

      # 80%는 목표이며 임계값 실패는 걸지 않는다(NFR-03, ADR-0022). 보고만 한다.
      # trx 로거가 첨부 파일을 TestResults/<trx 이름>/In/** 아래로 복사하므로
      # 한 단계 패턴(TestResults/*/)으로 테스트 프로젝트별 원본만 합산한다(중복 방지, 로컬 실측).
      - name: Coverage report
        run: |
          dotnet tool run reportgenerator \
            "-reports:TestResults/*/coverage.cobertura.xml" \
            "-targetdir:coveragereport" \
            "-reporttypes:Html;TextSummary;MarkdownSummaryGithub"
          cat coveragereport/Summary.txt
          cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results (trx)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coveragereport/
          if-no-files-found: ignore
          retention-days: 14
